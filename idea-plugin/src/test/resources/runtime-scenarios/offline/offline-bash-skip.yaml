name: offline-bash-skip
live: false
workspaceFixture: basic
goal: Start a command and then skip it.
config:
  provider: DEEPSEEK
  model: deepseek-reasoner
controls:
  skipOnTool: bash
  skipDelayMs: 200
expected:
  requireReasoning: true
  requireNonEmptyAnswer: true
  requiredTools:
    - bash
  forbiddenEvents:
    - error
  toolOutputContains:
    bash: Skipped by user
script:
  - reasoning: I should start a command that will be interrupted.
    toolCalls:
      - id: call-bash-skip
        name: bash
        args:
          command: Start-Sleep -Seconds 5; Write-Output 'skip me'
          description: Trigger skip
          shell: powershell
          timeout: 10000
  - text: The skip behavior was exercised.
