name: offline-file-tools
live: false
workspaceFixture: basic
goal: Inspect the workspace and update files.
config:
  provider: DEEPSEEK
  model: deepseek-reasoner
controls:
  approvePending: true
expected:
  requireReasoning: true
  requireNonEmptyAnswer: true
  requiredTools:
    - ls
    - glob
    - grep
    - read
    - write
    - edit
    - delete_file
  forbiddenEvents:
    - error
  answerContains: README.md
script:
  - reasoning: I should inspect the fixture files first.
    toolCalls:
      - id: call-ls
        name: ls
        args:
          path: .
      - id: call-glob
        name: glob
        args:
          pattern: "**/*.md"
      - id: call-grep
        name: grep
        args:
          pattern: fixture
          path: .
      - id: call-read
        name: read
        args:
          filePath: README.md
  - toolCalls:
      - id: call-write
        name: write
        args:
          filePath: notes/generated.txt
          content: generated by runtime harness
      - id: call-edit
        name: edit
        args:
          filePath: notes/generated.txt
          oldString: runtime harness
          newString: runtime scenario harness
      - id: call-delete
        name: delete_file
        args:
          filePath: scratch/delete-me.txt
  - text: I read README.md and updated notes/generated.txt.
