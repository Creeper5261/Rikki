name: offline-task-todo-bash
live: false
workspaceFixture: basic
goal: Update todos, delegate a task, and run a harmless shell command.
config:
  provider: DEEPSEEK
  model: deepseek-reasoner
expected:
  requireReasoning: true
  requireNonEmptyAnswer: true
  requiredTools:
    - todo_write
    - todo_read
    - task
    - bash
  forbiddenEvents:
    - error
  toolOutputContains:
    bash: runtime harness
script:
  - reasoning: I should update the todo list, delegate a subtask, and print a marker.
    toolCalls:
      - id: call-todo-write
        name: todo_write
        args:
          todos:
            - content: Verify runtime harness
              status: in_progress
              priority: high
      - id: call-todo-read
        name: todo_read
        args: {}
      - id: call-task
        name: task
        args:
          description: Check runtime harness status
          prompt: Summarize the current runtime harness state.
          subagent_type: general
      - id: call-bash
        name: bash
        args:
          command: Write-Output 'runtime harness'
          description: Print runtime marker
          shell: powershell
          timeout: 5000
  - text: Todo, task, and bash all completed.
